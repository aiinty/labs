services:
  yaade:
    image: esperotech/yaade:latest
    restart: always
    ports:
      - "9339:9339"
    volumes:
      - yaade_data:/app/data
    environment:
      YAADE_ADMIN_USERNAME: admin

  team1:
    build:
      context: .
      dockerfile: Dockerfile
    image: pocketbase:oat
    container_name: pb-team1
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - pb_teams:/pb_data
    environment:
      ADMIN_EMAIL: team1@oat.ru
      ADMIN_PASSWORD: "admin12345"
      PB_DATA_DIR: /pb_data/team1

  team2:
    extends:
      file: team.yml
      service: team
    container_name: pb-team2
    ports:
      - "8082:8080"
    environment:
      ADMIN_EMAIL: team2@oat.ru
      ADMIN_PASSWORD: "admin12345"
      PB_DATA_DIR: /pb_data/team2

  team3:
